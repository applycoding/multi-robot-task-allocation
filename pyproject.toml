# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "multi-robot-task-allocation"
version = "1.0.0"
description = "Simulation-only multi-robot coverage zone assignment lab"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Arpan Bom", email = "applycoding@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.2",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pip-tools==7.6.2",
]

[project.scripts]
mrta = "multi_robot_task_allocation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_robot_task_allocation"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["multi_robot_task_allocation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["multi_robot_task_allocation"]
branch = true
omit = ["*/cli.py"]

[tool.coverage.report]
fail_under = 80
